name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal pkg sdk)"

      - name: Vet
        run: go vet ./...

      - name: Run tests with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce internal/store coverage floor (60%)
        run: |
          awk '
            /^github.com\/omniswitch-dev\/omniswitch\/internal\/store\// {
              statements += $2
              if ($3 > 0) covered += $2
            }
            END {
              if (statements == 0) {
                print "No internal/store coverage data"
                exit 1
              }
              percentage = 100 * covered / statements
              printf "internal/store coverage %.1f%% (floor 60%%)\n", percentage
              if (percentage < 60) exit 1
            }
          ' coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omniswitch
          POSTGRES_DB: omniswitch
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omniswitch -d omniswitch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OMNISWITCH_TEST_DATABASE_URL: postgres://omniswitch@localhost:5432/omniswitch?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - run: go test -race -p 2 ./internal/store ./internal/gateway ./cmd/gateway

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m

  bench:
    name: Bench harness and claims register
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: bench/go.mod
          cache: false

      - name: Verify formatting
        working-directory: bench
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: bench
        run: go vet ./...

      - name: Test
        working-directory: bench
        run: go test -race ./...

      - name: Build harness binaries
        working-directory: bench
        run: go build -trimpath ./...

      - name: Check COMPARISON.md matches claims.yaml
        run: python3 bench/tools/render-comparison --check

  build:
    name: Build binaries
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build gateway
        run: go build -trimpath ./cmd/gateway
